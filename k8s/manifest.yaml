apiVersion: v1
kind: Namespace
metadata:
  name: moogielly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moogielly
  namespace: moogielly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moogielly
  template:
    metadata:
      labels:
        app: moogielly
    spec:
      containers:
        - name: moogielly
          image: ghcr.io/ggsbig/moogielly:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moogielly
  namespace: moogielly
spec:
  selector:
    app: moogielly
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: moogielly
  namespace: moogielly
spec:
  ingressClassName: nginx
  rules:
    # 主要名稱：需在各裝置 /etc/hosts 或區網 DNS 指到 192.168.1.115
    - host: moogielly.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moogielly
                port:
                  number: 80
    # 備援：IP 內嵌的 nip.io（公開 DNS 直接可解析）
    - host: moogielly.192.168.1.115.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: moogielly
                port:
                  number: 80
